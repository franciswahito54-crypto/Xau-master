name: Build XAU APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: |
          if [ ! -f eas.json ]; then
            echo '{
              "build": {
                "preview": {
                  "distribution": "internal",
                  "android": { "buildType": "apk" }
                }
              }
            }' > eas.json
          fi
      - run: npm install -g eas-cli
      - run: eas build --platform android --profile preview --local --output XAU-Master.apk --non-interactive || npx expo prebuild --platform android --clean && cd android && ./gradlew assembleRelease && cp app/build/outputs/apk/release/*.apk ../XAU-Master.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XAU-Master-APK
          path: XAU-Master.apk
